name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.x'
  GOWORK: 'off'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-ci: ${{ steps.changes.outputs['run-ci'] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/ci.sh changes

  go-static:
    name: Go static
    needs: changes
    if: needs.changes.outputs['run-ci'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Go build and test cache
        uses: ./.github/actions/go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check module metadata
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

  go-race:
    name: Go race
    needs: changes
    if: needs.changes.outputs['run-ci'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Go race build and test cache
        uses: ./.github/actions/go-cache
        with:
          go-version: ${{ env.GO_VERSION }}
          mode: race

      - name: Test with race detector
        env:
          GORACE: atexit_sleep_ms=0
        run: go test -race -vet=off ./...

  examples:
    name: Examples
    needs: changes
    if: needs.changes.outputs['run-ci'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Go build and test cache
        uses: ./.github/actions/go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Exercise and compile examples
        run: |
          quickstart_out="$RUNNER_TEMP/skelc-quickstart"
          commerce_out="$RUNNER_TEMP/skelc-commerce"

          ./examples/quickstart/generate.sh "$quickstart_out"
          (
            cd "$quickstart_out/go"
            GOWORK=off go test -mod=mod ./...
          )

          ./examples/commerce/generate.sh "$commerce_out"
          (
            cd "$commerce_out/go/identitypub"
            GOWORK=off go test -mod=mod ./...
          )
          for module in identity order; do
            (
              cd "$commerce_out/go/$module"
              go mod edit \
                -replace example.com/yorun/commerce/identitypub=../identitypub
              GOWORK=off go test -mod=mod ./...
            )
          done

  ci-checks:
    name: CI / Required Checks
    if: ${{ always() }}
    needs: [changes, go-static, go-race, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/ci.sh verify
