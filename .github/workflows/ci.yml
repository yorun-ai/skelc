name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.x'
  GOWORK: 'off'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-static:
    name: Go static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Check module metadata
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

  go-race:
    name: Go race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Test with race detector
        env:
          GORACE: atexit_sleep_ms=0
        run: go test -race -vet=off ./...

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Exercise and compile examples
        run: |
          quickstart_out="$RUNNER_TEMP/skelc-quickstart"
          commerce_out="$RUNNER_TEMP/skelc-commerce"

          ./examples/quickstart/generate.sh "$quickstart_out"
          (
            cd "$quickstart_out/go"
            GOWORK=off go test -mod=mod ./...
          )

          ./examples/commerce/generate.sh "$commerce_out"
          (
            cd "$commerce_out/go/identitypub"
            GOWORK=off go test -mod=mod ./...
          )
          for module in identity order; do
            (
              cd "$commerce_out/go/$module"
              go mod edit \
                -replace example.com/yorun/commerce/identitypub=../identitypub
              GOWORK=off go test -mod=mod ./...
            )
          done

  ci-checks:
    name: CI / Required Checks
    if: ${{ always() }}
    needs: [go-static, go-race, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
