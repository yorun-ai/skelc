name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.x'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Check module metadata
        run: GOWORK=off go mod tidy -diff

      - name: Test with race detector
        run: GOWORK=off go test -race ./...

      - name: Run go vet
        run: GOWORK=off go vet ./...

      - name: Exercise and compile examples
        run: |
          quickstart_out="$RUNNER_TEMP/skelc-quickstart"
          commerce_out="$RUNNER_TEMP/skelc-commerce"

          ./examples/quickstart/generate.sh "$quickstart_out"
          (
            cd "$quickstart_out/go"
            GOWORK=off go test -mod=mod ./...
          )

          ./examples/commerce/generate.sh "$commerce_out"
          (
            cd "$commerce_out/go/identitypub"
            GOWORK=off go test -mod=mod ./...
          )
          for module in identity order; do
            (
              cd "$commerce_out/go/$module"
              go mod edit \
                -replace example.com/yorun/commerce/identitypub=../identitypub
              GOWORK=off go test -mod=mod ./...
            )
          done

  ci-checks:
    name: CI / Required Checks
    if: ${{ always() }}
    needs: [go]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq --exit-status 'all(.[]; .result == "success")'
