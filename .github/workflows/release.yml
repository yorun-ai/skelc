name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use the v<major>.<minor>.<patch> format"
            exit 1
          fi

          git tag --points-at HEAD --list "$RELEASE_TAG" | grep -Fx "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate changelog release
        run: |
          version="${RELEASE_TAG#v}"
          prefix="## [$version] - "
          release_heading="$(grep -F "$prefix" CHANGELOG.md || true)"
          release_date="${release_heading#"$prefix"}"
          if [[ "$release_heading" != "$prefix$release_date" ||
                ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "CHANGELOG.md must contain a dated [$version] release heading"
            exit 1
          fi

      - name: Build archives
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          ldflags="-s -w -X go.yorun.ai/skelc/internal/cli.ldModuleVersion=$RELEASE_TAG"
          mkdir -p dist

          for target in \
            darwin/amd64 \
            darwin/arm64 \
            linux/amd64 \
            linux/arm64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="skelc_${version}_${goos}_${goarch}"
            stage="dist/$archive"

            mkdir -p "$stage"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              GOMODCACHE="$RUNNER_TEMP/go-mod" \
              go build -trimpath -ldflags "$ldflags" \
                -o "$stage/skelc" ./cmd/skelc
            go version -m "$stage/skelc" | awk '
              $1 == "mod" && $2 == "go.yorun.ai/skelc" { found = 1 }
              END { exit !found }
            '
            cp LICENSE README.md "$stage/"
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          done

          release_binary="dist/skelc_${version}_linux_amd64/skelc"
          actual_version="$("$release_binary" version | jq -er '.version')"
          if [[ "$actual_version" != "$RELEASE_TAG" ]]; then
            echo "Built skelc version $actual_version does not match release tag $RELEASE_TAG"
            exit 1
          fi

      - name: Create checksums
        run: |
          cd dist
          sha256sum skelc_*.tar.gz > checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/skelc_*.tar.gz \
            dist/checksums.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
